<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" role="img" aria-label="Data recovery not measured"><rect width="1000" height="130" fill="#0d1117"/><text x="16" y="32" fill="#e6edf3" font-family="sans-serif" font-size="18">AmazingMirrorDecomp | data recovery: not measured</text><text x="16" y="66" fill="#e6edf3" font-family="sans-serif" font-size="13">Source assets and raw ranges require a separate format and boundary audit.</text><text x="16" y="96" fill="#e6edf3" font-family="sans-serif" font-size="13">No automatic credit for preserved bytes, INCBIN counts or native ports.</text></svg>